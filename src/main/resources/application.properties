spring.application.name=backend
# Public address of the site, used in password reset links. Set APP_BASE_URL when deploying (e.g. https://iss.school.lk).
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Session cookie: not readable by scripts, not sent with cross-site requests. Set secure=true when served over HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
spring.datasource.url=jdbc:mysql://localhost:3306/interview_db
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# The server is XAMPP MariaDB 10.4; without this Hibernate reads its version as "MySQL 5.5.5"
spring.jpa.properties.jakarta.persistence.database-product-name=MariaDB
spring.jpa.properties.jakarta.persistence.database-major-version=10
spring.jpa.properties.jakarta.persistence.database-minor-version=4
# Strict mode for this app's connections only: a value too long for its column is rejected
# instead of being cut off silently. Other databases on the server are not affected.
spring.datasource.hikari.connection-init-sql=SET SESSION sql_mode='STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'
# Pages read lazy-loaded details (e.g. an application's student) while rendering, so keep the session open for the view
spring.jpa.open-in-view=true
# Email account: put your Gmail address and App Password in mail.properties
# (project root, not committed to git) or in MAIL_USERNAME / MAIL_PASSWORD.
spring.config.import=optional:file:./mail.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:YOUR_EMAIL@gmail.com}
spring.mail.password=${MAIL_PASSWORD:YOUR_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
