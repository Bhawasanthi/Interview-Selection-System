<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/public :: head('Reset Password | Interview Selection System')}"></head>

<body>

<th:block th:replace="~{fragments/public :: header('')}"></th:block>


<section class="section section-paper">

    <div class="container" style="max-width: 520px;">

        <div class="form-card">

            <div class="round-icon mb-3">
                <i class="fa-solid fa-key"></i>
            </div>


            <!-- INVALID / EXPIRED LINK -->

            <th:block th:if="${target == null}">

                <h2>Link Expired</h2>
                <div class="red-line"></div>

                <p class="text-muted">
                    This password reset link is invalid, has already been used, or has expired.
                    Reset links work once and are valid for 30 minutes.
                </p>

                <a th:href="@{/?forgot}" class="btn btn-maroon w-100" data-bs-toggle="modal" data-bs-target="#forgotModal">
                    <i class="fa-solid fa-paper-plane"></i> Request a New Link
                </a>

            </th:block>


            <!-- CHOOSE A NEW PASSWORD -->

            <th:block th:if="${target != null}">

                <h2>Choose a New Password</h2>
                <div class="red-line"></div>

                <p class="text-muted mb-4">
                    Setting a new password for
                    <strong class="text-dark" th:text="${target.name ?: target.username}">Name</strong>
                    (username <strong class="text-dark" th:text="${target.username}">user</strong>).
                </p>

                <div class="alert alert-danger py-2" th:if="${resetError}">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span th:text="${resetError}"></span>
                </div>

                <form th:action="@{/reset-password}" method="post" id="resetForm">

                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-3">
                        <label class="form-label" for="newPassword">New password</label>
                        <input type="password" class="form-control" id="newPassword" name="newPassword"
                               minlength="6" autocomplete="new-password" required autofocus>
                        <div class="form-text">At least 6 characters.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="confirmPassword">Confirm new password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                               minlength="6" autocomplete="new-password" required>
                        <div class="invalid-feedback">The passwords do not match.</div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="showNew"
                               data-toggle-password="newPassword,confirmPassword">
                        <label class="form-check-label" for="showNew">Show passwords</label>
                    </div>

                    <button type="submit" class="btn btn-maroon w-100">
                        <i class="fa-solid fa-floppy-disk"></i> Change Password
                    </button>

                </form>

            </th:block>

        </div>

    </div>

</section>


<footer th:replace="~{fragments/public :: footer}"></footer>

<th:block th:replace="~{fragments/public :: modals}"></th:block>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var form = document.getElementById("resetForm");
        if (!form) return;
        var pw = document.getElementById("newPassword");
        var confirm = document.getElementById("confirmPassword");
        form.addEventListener("submit", function (e) {
            if (pw.value !== confirm.value) {
                e.preventDefault();
                e.stopImmediatePropagation();
                confirm.classList.add("is-invalid");
                confirm.focus();
            }
        }, true);
        confirm.addEventListener("input", function () { confirm.classList.remove("is-invalid"); });
    });
</script>

</body>

</html>
