<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app :: layout('Students', 'admin', 'students', ~{::main})}">
<body>
<main>

    <div class="page-head">
        <div>
            <h1>Students</h1>
            <p>Every registered student account and its application.</p>
        </div>
        <div class="actions">
            <a class="btn btn-ghost" th:href="@{/admin/export-students(q=${q})}">
                <i class="fa-solid fa-file-excel"></i> Download Excel
            </a>
            <a class="btn btn-ghost" th:href="@{/admin/export-students(q=${q}, format='pdf')}">
                <i class="fa-solid fa-file-pdf"></i> Download PDF
            </a>
        </div>
    </div>


    <div class="card-gov">

        <form class="toolbar" method="get" th:action="@{/admin/students}" role="search">
            <div class="search-box">
                <label class="form-label" for="q">Search students</label>
                <div class="position-relative">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" class="form-control" id="q" name="q" th:value="${q}"
                           placeholder="Name, email, username, index or NIC number">
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-maroon" data-no-loading>
                    <i class="fa-solid fa-magnifying-glass"></i> Search
                </button>
                <a th:if="${q != null}" th:href="@{/admin/students}" class="btn btn-ghost">Clear</a>
            </div>
        </form>

        <div class="result-count">
            <strong th:text="${#lists.size(students)}">0</strong> students
        </div>

        <div class="table-scroll" th:if="${!#lists.isEmpty(students)}">
            <table class="table-gov table-stack">
                <thead>
                <tr>
                    <th>Student</th>
                    <th>Username</th>
                    <th>NIC</th>
                    <th>Index No.</th>
                    <th>Stream</th>
                    <th>Application</th>
                    <th class="actions-col">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${students}" th:with="app=${appByStudent.get(s.studentId)}">
                    <td class="cell-main">
                        <strong th:text="${s.fullName ?: '-'}">Name</strong>
                        <small th:text="${s.email}">email</small>
                    </td>
                    <td data-label="Username" th:text="${s.username}">username</td>
                    <td data-label="NIC" th:text="${s.nic ?: '-'}">NIC</td>
                    <td data-label="Index No." th:text="${s.indexNumber ?: '-'}">Index</td>
                    <td data-label="Stream" th:text="${app != null ? app.stream.streamName : '-'}">Stream</td>
                    <td data-label="Application">
                        <th:block th:if="${app != null}"><th:block th:replace="~{fragments/app :: status(${app.status})}"></th:block></th:block>
                        <span th:if="${app == null}" class="text-muted small">Not submitted</span>
                    </td>
                    <td class="actions-col">
                        <a th:href="@{/admin/students/{id}(id=${s.studentId})}" class="btn btn-sm btn-outline-maroon">
                            <i class="fa-solid fa-eye"></i> View
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <th:block th:if="${#lists.isEmpty(students)}">
            <div th:replace="~{fragments/app :: empty('fa-user-graduate', 'No students found', 'Try a different search term.')}"></div>
        </th:block>

    </div>

</main>
</body>
</html>
