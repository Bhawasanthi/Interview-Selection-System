<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app :: layout('Schools', 'admin', 'schools', ~{::main})}">
<body>
<main>

    <div class="page-head">
        <div>
            <h1>Schools</h1>
            <p>Schools that students can apply to. The name and address appear on every letter.</p>
        </div>
        <div class="actions">
            <a class="btn btn-ghost" th:href="@{/admin/export-schools}">
                <i class="fa-solid fa-file-excel"></i> Download Excel
            </a>
            <a class="btn btn-ghost" th:href="@{/admin/export-schools(format='pdf')}">
                <i class="fa-solid fa-file-pdf"></i> Download PDF
            </a>
            <button type="button" class="btn btn-maroon" data-bs-toggle="modal" data-bs-target="#schoolModal"
                    data-fill th:attr="data-action=@{/admin/schools/save}" data-heading="Add School">
                <i class="fa-solid fa-plus"></i> Add School
            </button>
        </div>
    </div>


    <div class="card-gov">

        <div class="table-scroll" th:if="${!#lists.isEmpty(schools)}">
            <table class="table-gov table-stack">
                <thead>
                <tr><th>School</th><th>District</th><th>Address</th><th class="num">Applications</th><th class="actions-col">Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="s : ${schools}">
                    <td class="cell-main"><strong th:text="${s.schoolName}">School</strong></td>
                    <td data-label="District" th:text="${s.district}">District</td>
                    <td data-label="Address" th:text="${s.schoolAddress}">Address</td>
                    <td class="num" data-label="Applications" th:text="${appCounts.getOrDefault(s.schoolId, 0)}">0</td>
                    <td class="actions-col">
                        <button type="button" class="btn btn-sm btn-ghost" data-bs-toggle="modal" data-bs-target="#schoolModal"
                                data-fill data-heading="Edit School"
                                th:attr="data-action=@{/admin/schools/save}, data-f-school-id=${s.schoolId},
                                         data-f-school-name=${s.schoolName}, data-f-district=${s.district},
                                         data-f-school-address=${s.schoolAddress}">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                        <form th:action="@{/admin/schools/{id}/delete(id=${s.schoolId})}" method="post" class="d-inline"
                              th:attr="data-confirm='Delete ' + ${s.schoolName} + '? This cannot be undone.'"
                              data-confirm-title="Delete School" data-confirm-ok="Delete" data-confirm-danger="true">
                            <button type="submit" class="btn btn-sm btn-danger-soft"><i class="fa-solid fa-trash"></i></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <th:block th:if="${#lists.isEmpty(schools)}">
            <div th:replace="~{fragments/app :: empty('fa-school', 'No schools yet', 'Add the school students will apply to.')}"></div>
        </th:block>

    </div>


    <!-- ADD / EDIT MODAL -->

    <div class="modal fade" id="schoolModal" tabindex="-1" aria-labelledby="schoolModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" method="post" th:action="@{/admin/schools/save}">
                <div class="modal-header">
                    <h5 class="modal-title" id="schoolModalTitle" data-heading="Add School">Add School</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="schoolId" data-reset>
                    <div class="mb-3">
                        <label class="form-label required" for="schoolName">School Name</label>
                        <input maxlength="150" type="text" class="form-control" id="schoolName" name="schoolName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label required" for="district">District</label>
                        <input maxlength="50" type="text" class="form-control" id="district" name="district" required>
                    </div>
                    <div>
                        <label class="form-label required" for="schoolAddress">Address</label>
                        <textarea maxlength="255" class="form-control" id="schoolAddress" name="schoolAddress" rows="2" required></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-maroon"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                </div>
            </form>
        </div>
    </div>

</main>
</body>
</html>
